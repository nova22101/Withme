<!DOCTYPE html>
<html>
<head>

    <title>یه سوال 🤍</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Marhey:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        body {
            background: #FFF8E7;
            text-align: center;
            font-family: "Marhey", sans-serif;
            padding-top: 100px;
            overflow: hidden;
        }

        h1 {
            color: #5c5144;
            font-size: 35px;
            font-weight: 600;
        }

        p {
            color: #5c5144;
            font-size: 22px;
            font-weight: 400;
        }

        button {
            font-family: "Marhey", sans-serif;
            font-size: 20px;
            font-weight: 500;
            padding: 12px 30px;
            margin: 10px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
        }

        .yes {
            background: #8fc9a3;
            color: white;
        }

        .no {
            background: #d98f8f;
            color: white;
        }

        .heart {
            position: fixed;
            font-size: 30px;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {

            0% {
                transform: translateY(-50px);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh);
                opacity: 0;
            }

        }

    </style>

</head>


<body>

    <h1>یه سوال</h1>

    <p>میای باهم بریم بیرون 🐱؟</p>

    <button class="yes">آره 😺</button>

    <button class="no">نه 😿</button>


    <script>

        const noButton = document.querySelector(".no");
        const yesButton = document.querySelector(".yes");


        noButton.addEventListener("mouseover", function() {

            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 70);

            noButton.style.position = "fixed";
            noButton.style.left = x + "px";
            noButton.style.top = y + "px";

        });


        yesButton.addEventListener("click", function() {

            document.body.innerHTML = `
                <h1>ایوللللل 😭🤍</h1>
                <p>پس قرارمون شد! 🤍</p>
                <p>منتظرت می‌مونم 🐱✨</p>
            `;


            document.body.style.background = "#FFF8E7";


            for (let i = 0; i < 25; i++) {

                const heart = document.createElement("div");

                heart.className = "heart";

                heart.innerHTML = "🤍";

                heart.style.left = Math.random() * 100 + "vw";

                heart.style.animationDelay =
                    Math.random() * 2 + "s";

                document.body.appendChild(heart);

            }

        });

    </script>

</body>
</html>
